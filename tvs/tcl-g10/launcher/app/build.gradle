plugins {
    id "com.android.application"
}

// Weather location: kept out of git in launcher/weather.properties (city, lat, lon, unit).
// Without that file the build uses the defaults below.
def weather = new Properties()
def weatherFile = rootProject.file("weather.properties")
if (weatherFile.exists()) weatherFile.withInputStream { weather.load(it) }

android {
    namespace "com.cleantv.launcher"
    compileSdk 35

    defaultConfig {
        applicationId "com.cleantv.launcher"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"
        resValue "string", "weather_city", weather.getProperty("city", "Toronto")
        resValue "string", "weather_lat", weather.getProperty("lat", "43.6532")
        resValue "string", "weather_lon", weather.getProperty("lon", "-79.3832")
        resValue "string", "weather_unit", weather.getProperty("unit", "celsius")
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation "androidx.recyclerview:recyclerview:1.3.2"
}
